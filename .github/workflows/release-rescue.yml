name: Rescue publish SwirPhotoClean 1.0

on:
  pull_request:
    paths:
      - ".github/workflows/release-rescue.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-rescue.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify unchanged qualified release gate
        run: |
          python tools/readme_progress.py --check
          python tools/release_evidence.py verify --file RELEASE_EVIDENCE.json
          python tools/release_gate.py --check
      - name: Prove direct provenance CLI can import repository package
        shell: pwsh
        run: |
          "rescue-provenance-probe" | Set-Content rescue-probe.bin -Encoding utf8
          python tools/release_provenance.py write --archive rescue-probe.bin --output rescue-probe.provenance.json --version 1.0.0 --commit $env:GITHUB_SHA --workflow-run-id $env:GITHUB_RUN_ID --channel stable
          if ($LASTEXITCODE -ne 0) { throw "Rescue provenance write failed" }
          python tools/release_provenance.py verify --archive rescue-probe.bin --manifest rescue-probe.provenance.json --expected-version 1.0.0 --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel stable
          if ($LASTEXITCODE -ne 0) { throw "Rescue provenance verify failed" }

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify exact-head acceptance and evidence
        shell: pwsh
        run: |
          python tools/readme_progress.py --check
          if ($LASTEXITCODE -ne 0) { throw "README progress contract failed" }
          python tools/release_evidence.py verify --file RELEASE_EVIDENCE.json
          if ($LASTEXITCODE -ne 0) { throw "Release evidence validation failed" }
          python tools/release_gate.py --check
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }

      - run: python -m pip install -r requirements-build.txt

      - name: Exact-head source tests
        run: |
          python -m compileall -q photoclean tools
          python -m unittest discover -s tests -v

      - name: Regenerate and verify exact safety contract
        shell: pwsh
        run: |
          python tools/safety_contract.py write
          if ($LASTEXITCODE -ne 0) { throw "Safety contract generation failed" }
          python tools/safety_contract.py verify
          if ($LASTEXITCODE -ne 0) { throw "Safety contract verification failed" }
          $evidenceContract = (Get-Content RELEASE_EVIDENCE.json -Raw | ConvertFrom-Json).safety_contract_sha256
          $currentContract = (Get-Content assets/safety-contract.json -Raw | ConvertFrom-Json).sha256
          if ($evidenceContract -ne $currentContract) {
            throw "Physical Windows evidence no longer matches the exact release safety contract"
          }

      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name SwirPhotoClean --icon assets/SwirPhotoClean.ico --add-data "assets;assets" run.py

      - name: Smoke packaged portable app
        shell: pwsh
        run: |
          $reportPath = Join-Path $PWD "rescue-packaged-smoke.json"
          $process = Start-Process -FilePath dist/SwirPhotoClean/SwirPhotoClean.exe -ArgumentList "--self-test", $reportPath -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw "Packaged app timed out" }
          if ($process.ExitCode -ne 0) { throw "Packaged app failed" }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw "Packaged app self-test report failed" }
          $evidenceContract = (Get-Content RELEASE_EVIDENCE.json -Raw | ConvertFrom-Json).safety_contract_sha256
          if ($report.safety_contract_sha256 -ne $evidenceContract) { throw "Packaged app safety contract differs from evidence" }

          $portableReport = Join-Path $PWD "rescue-portable-smoke.json"
          $process = Start-Process -FilePath dist/SwirPhotoClean/SwirPhotoClean.exe -ArgumentList "--portable", "--self-test", $portableReport -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw "Portable mode timed out" }
          if ($process.ExitCode -ne 0) { throw "Portable mode failed" }
          $portable = Get-Content $portableReport -Raw | ConvertFrom-Json
          if (-not $portable.ok -or -not $portable.portable_mode_exercised -or -not $portable.portable_settings_local -or -not $portable.portable_data_dir_writable) {
            throw "Portable mode qualification failed"
          }
          if ($portable.safety_contract_sha256 -ne $evidenceContract) { throw "Portable mode contract differs from evidence" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path photoclean/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw "Missing version" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler is unavailable at $iscc" }
          & $iscc "/DMyAppVersion=$version" "installer/SwirPhotoClean.iss"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }

      - name: Smoke Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path photoclean/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          $installer = Join-Path $PWD "installer-output/SwirPhotoClean-$version-Windows-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "SwirPhotoClean-rescue-installer-smoke"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $process = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id; throw "Installer timed out" }
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }

          $installedExe = Join-Path $installDir "SwirPhotoClean.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed executable is missing" }
          $reportPath = Join-Path $PWD "rescue-installed-smoke.json"
          $process = Start-Process -FilePath $installedExe -ArgumentList "--self-test", $reportPath -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw "Installed app self-test timed out" }
          if ($process.ExitCode -ne 0) { throw "Installed app self-test failed" }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          $evidenceContract = (Get-Content RELEASE_EVIDENCE.json -Raw | ConvertFrom-Json).safety_contract_sha256
          if (-not $report.ok -or $report.safety_contract_sha256 -ne $evidenceContract) {
            throw "Installed app qualification failed"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing" }
          $process = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id; throw "Uninstaller timed out" }
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($process.ExitCode)" }

      - name: Stage, publish and post-smoke v1.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path photoclean/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw "Missing version" }
          $channel = (python tools/release_gate.py --channel).Trim()
          if ($LASTEXITCODE -ne 0 -or $channel -ne "stable") { throw "Stable release channel is not authorized" }

          Copy-Item README.md, RELEASE_NOTES.md, STATUS.md, RELEASE_EVIDENCE.json dist/SwirPhotoClean/

          $archive = "SwirPhotoClean-$version-Windows.zip"
          $archiveChecksum = "$archive.sha256"
          $archiveProvenance = "$archive.provenance.json"
          $installerName = "SwirPhotoClean-$version-Windows-Setup.exe"
          $installerPath = Join-Path $PWD "installer-output/$installerName"
          $installerChecksum = "$installerName.sha256"
          $installerProvenance = "$installerName.provenance.json"

          Compress-Archive -Path dist/SwirPhotoClean -DestinationPath $archive
          $archiveDigest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$archiveDigest  $archive" | Set-Content $archiveChecksum -Encoding utf8
          $installerDigest = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          "$installerDigest  $installerName" | Set-Content $installerChecksum -Encoding utf8

          python tools/release_provenance.py write --archive $archive --output $archiveProvenance --version $version --commit $env:GITHUB_SHA --workflow-run-id $env:GITHUB_RUN_ID --channel stable
          if ($LASTEXITCODE -ne 0) { throw "ZIP provenance creation failed" }
          python tools/release_provenance.py verify --archive $archive --manifest $archiveProvenance --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel stable
          if ($LASTEXITCODE -ne 0) { throw "ZIP provenance verification failed" }

          python tools/release_provenance.py write --archive $installerPath --output $installerProvenance --version $version --commit $env:GITHUB_SHA --workflow-run-id $env:GITHUB_RUN_ID --channel stable
          if ($LASTEXITCODE -ne 0) { throw "Installer provenance creation failed" }
          python tools/release_provenance.py verify --archive $installerPath --manifest $installerProvenance --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel stable
          if ($LASTEXITCODE -ne 0) { throw "Installer provenance verification failed" }

          function Test-ZipPackage {
            param([string]$ZipPath, [string]$Label)
            $root = Join-Path $env:RUNNER_TEMP "SwirPhotoClean-$Label-zip"
            if (Test-Path $root) { Remove-Item $root -Recurse -Force }
            Expand-Archive -Path $ZipPath -DestinationPath $root
            $exe = Join-Path $root "SwirPhotoClean/SwirPhotoClean.exe"
            $embeddedEvidence = Join-Path $root "SwirPhotoClean/RELEASE_EVIDENCE.json"
            if (-not (Test-Path $exe) -or -not (Test-Path $embeddedEvidence)) { throw "$Label ZIP is incomplete" }
            python tools/release_evidence.py verify --file $embeddedEvidence
            if ($LASTEXITCODE -ne 0) { throw "$Label embedded evidence is invalid" }
            $reportPath = Join-Path $PWD "$Label-zip-selftest.json"
            $process = Start-Process -FilePath $exe -ArgumentList "--self-test", $reportPath -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw "$Label ZIP self-test timed out" }
            if ($process.ExitCode -ne 0) { throw "$Label ZIP self-test failed" }
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            $evidenceContract = (Get-Content $embeddedEvidence -Raw | ConvertFrom-Json).safety_contract_sha256
            if (-not $report.ok -or $report.safety_contract_sha256 -ne $evidenceContract) { throw "$Label ZIP contract mismatch" }
          }

          function Test-InstallerPackage {
            param([string]$SetupPath, [string]$Label)
            $installDir = Join-Path $env:RUNNER_TEMP "SwirPhotoClean-$Label-install"
            if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
            $process = Start-Process -FilePath $SetupPath -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir") -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id; throw "$Label installer timed out" }
            if ($process.ExitCode -ne 0) { throw "$Label installer failed" }
            $exe = Join-Path $installDir "SwirPhotoClean.exe"
            $reportPath = Join-Path $PWD "$Label-installer-selftest.json"
            $process = Start-Process -FilePath $exe -ArgumentList "--self-test", $reportPath -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw "$Label installed app timed out" }
            if ($process.ExitCode -ne 0) { throw "$Label installed app failed" }
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            $evidenceContract = (Get-Content RELEASE_EVIDENCE.json -Raw | ConvertFrom-Json).safety_contract_sha256
            if (-not $report.ok -or $report.safety_contract_sha256 -ne $evidenceContract) { throw "$Label installer contract mismatch" }
            $uninstaller = Join-Path $installDir "unins000.exe"
            $process = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id; throw "$Label uninstall timed out" }
            if ($process.ExitCode -ne 0) { throw "$Label uninstall failed" }
          }

          Test-ZipPackage -ZipPath $archive -Label "prepublish"
          Test-InstallerPackage -SetupPath $installerPath -Label "prepublish"

          $existing = gh release view "v$version" --json isDraft --jq ".isDraft" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing.Trim() -eq "true") {
              gh release delete "v$version" -y --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Could not remove stale draft release" }
            } else {
              throw "Public v$version already exists; refusing to overwrite it"
            }
          }

          $assets = @(
            $archive,
            $archiveChecksum,
            $archiveProvenance,
            $installerPath,
            $installerChecksum,
            $installerProvenance,
            "RELEASE_EVIDENCE.json"
          )
          gh release create "v$version" @assets --target $env:GITHUB_SHA --title "SWIR PhotoClean $version — Polski / English" --notes-file RELEASE_NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed" }

          $draftDir = Join-Path $PWD "rescue-draft-assets"
          New-Item -ItemType Directory -Path $draftDir -Force | Out-Null
          gh release download "v$version" --dir $draftDir --pattern $archive --pattern $archiveChecksum --pattern $archiveProvenance --pattern $installerName --pattern $installerChecksum --pattern $installerProvenance --pattern "RELEASE_EVIDENCE.json"
          if ($LASTEXITCODE -ne 0) { throw "Could not download draft assets" }

          $downloadedArchive = Join-Path $draftDir $archive
          $downloadedArchiveChecksum = Join-Path $draftDir $archiveChecksum
          $expectedArchive = ((Get-Content $downloadedArchiveChecksum -Raw).Trim() -split "\s+")[0].ToLower()
          $actualArchive = (Get-FileHash $downloadedArchive -Algorithm SHA256).Hash.ToLower()
          if ($expectedArchive -ne $actualArchive) { throw "Draft ZIP checksum mismatch" }
          python tools/release_provenance.py verify --archive $downloadedArchive --manifest (Join-Path $draftDir $archiveProvenance) --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel stable
          if ($LASTEXITCODE -ne 0) { throw "Draft ZIP provenance mismatch" }

          $downloadedInstaller = Join-Path $draftDir $installerName
          $downloadedInstallerChecksum = Join-Path $draftDir $installerChecksum
          $expectedInstaller = ((Get-Content $downloadedInstallerChecksum -Raw).Trim() -split "\s+")[0].ToLower()
          $actualInstaller = (Get-FileHash $downloadedInstaller -Algorithm SHA256).Hash.ToLower()
          if ($expectedInstaller -ne $actualInstaller) { throw "Draft installer checksum mismatch" }
          python tools/release_provenance.py verify --archive $downloadedInstaller --manifest (Join-Path $draftDir $installerProvenance) --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel stable
          if ($LASTEXITCODE -ne 0) { throw "Draft installer provenance mismatch" }

          $downloadedEvidence = Join-Path $draftDir "RELEASE_EVIDENCE.json"
          python tools/release_evidence.py verify --file $downloadedEvidence
          if ($LASTEXITCODE -ne 0) { throw "Draft evidence validation failed" }
          Test-ZipPackage -ZipPath $downloadedArchive -Label "draft"
          Test-InstallerPackage -SetupPath $downloadedInstaller -Label "draft"

          gh release edit "v$version" --draft=false --prerelease=false
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

          try {
            $state = (gh release view "v$version" --json isDraft,isPrerelease --jq '"draft=" + (.isDraft|tostring) + " prerelease=" + (.isPrerelease|tostring)').Trim()
            if ($LASTEXITCODE -ne 0 -or $state -ne "draft=false prerelease=false") { throw "Published release state is invalid: $state" }

            $publishedDir = Join-Path $PWD "rescue-published-assets"
            New-Item -ItemType Directory -Path $publishedDir -Force | Out-Null
            gh release download "v$version" --dir $publishedDir --pattern $archive --pattern $archiveChecksum --pattern $archiveProvenance --pattern $installerName --pattern $installerChecksum --pattern $installerProvenance --pattern "RELEASE_EVIDENCE.json"
            if ($LASTEXITCODE -ne 0) { throw "Could not download published assets" }

            $publishedArchive = Join-Path $publishedDir $archive
            $publishedInstaller = Join-Path $publishedDir $installerName
            python tools/release_provenance.py verify --archive $publishedArchive --manifest (Join-Path $publishedDir $archiveProvenance) --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel stable
            if ($LASTEXITCODE -ne 0) { throw "Published ZIP provenance mismatch" }
            python tools/release_provenance.py verify --archive $publishedInstaller --manifest (Join-Path $publishedDir $installerProvenance) --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel stable
            if ($LASTEXITCODE -ne 0) { throw "Published installer provenance mismatch" }
            python tools/release_evidence.py verify --file (Join-Path $publishedDir "RELEASE_EVIDENCE.json")
            if ($LASTEXITCODE -ne 0) { throw "Published evidence validation failed" }
            Test-ZipPackage -ZipPath $publishedArchive -Label "published"
            Test-InstallerPackage -SetupPath $publishedInstaller -Label "published"
          } catch {
            $failure = $_
            gh release edit "v$version" --draft
            throw $failure
          }

          gh release view "v$version" --json url,tagName,isDraft,isPrerelease
