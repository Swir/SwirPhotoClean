name: Windows tests and portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Core and GUI tests
        run: python -m unittest discover -s tests -v
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name SwirPhotoClean --icon assets/SwirPhotoClean.ico --add-data "assets;assets" run.py
      - name: Smoke-test the packaged executable
        shell: pwsh
        run: |
          $reportPath = Join-Path $PWD 'packaged-smoke.json'
          $process = Start-Process -FilePath dist/SwirPhotoClean/SwirPhotoClean.exe -ArgumentList '--self-test', $reportPath -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw 'Packaged app timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged app failed' }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SwirPhotoClean-windows-portable
          path: dist/SwirPhotoClean/
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SwirPhotoClean-windows-portable
          path: package/SwirPhotoClean
      - name: Publish tested portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path photoclean/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw 'Missing version' }
          Copy-Item README.md, RELEASE_NOTES.md, STATUS.md package/SwirPhotoClean/
          $archive = "SwirPhotoClean-$version-Windows.zip"
          Compress-Archive -Path package/SwirPhotoClean -DestinationPath $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$digest  $archive" | Set-Content "$archive.sha256" -Encoding utf8
          gh release create "v$version" $archive "$archive.sha256" --target $env:GITHUB_SHA --title "SWIR PhotoClean $version — Polski / English" --notes-file RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
