name: Windows tests and portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify README progress contract
        run: python tools/readme_progress.py --check
      - name: Verify release safety contract
        run: python tools/release_gate.py --check
      - run: python -m pip install -r requirements-build.txt
      - name: Compile Python modules
        run: python -m compileall -q photoclean tools
      - name: Core and GUI tests
        run: python -m unittest discover -s tests -v
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name SwirPhotoClean --icon assets/SwirPhotoClean.ico --add-data "assets;assets" run.py
      - name: Smoke-test the packaged executable
        shell: pwsh
        run: |
          $reportPath = Join-Path $PWD 'packaged-smoke.json'
          $process = Start-Process -FilePath dist/SwirPhotoClean/SwirPhotoClean.exe -ArgumentList '--self-test', $reportPath -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw 'Packaged app timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged app failed' }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged smoke test failed' }
      - name: Smoke-test packaged Portable Mode
        shell: pwsh
        run: |
          $reportPath = Join-Path $PWD 'packaged-portable-smoke.json'
          $process = Start-Process -FilePath dist/SwirPhotoClean/SwirPhotoClean.exe -ArgumentList '--portable', '--self-test', $reportPath -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw 'Packaged Portable Mode timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged Portable Mode failed' }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged Portable Mode smoke test failed' }
          if (-not $report.portable_mode_exercised) { throw 'Portable Mode was not exercised' }
          if (-not $report.portable_settings_local) { throw 'Portable settings path is not local to the package data directory' }
          if (-not $report.portable_data_dir_writable) { throw 'Portable data directory was not writable in the packaged smoke test' }
      - name: Smoke-test packaged Recycle restore command dispatch
        shell: pwsh
        run: |
          foreach ($command in @('--recycle-restore-verify', '--recycle-restore-move', '--recycle-restore-status', '--recycle-restore-review')) {
            $process = Start-Process -FilePath dist/SwirPhotoClean/SwirPhotoClean.exe -ArgumentList $command -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id; throw "Packaged Recycle command timed out: $command" }
            if ($process.ExitCode -ne 2) { throw "Expected safe argument-validation exit code 2 for $command, got $($process.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SwirPhotoClean-windows-portable
          path: dist/SwirPhotoClean/
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release gate
        run: |
          python tools/readme_progress.py --check
          python tools/release_gate.py --check
      - uses: actions/download-artifact@v4
        with:
          name: SwirPhotoClean-windows-portable
          path: package/SwirPhotoClean
      - name: Publish tested portable release and verify public assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path photoclean/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw 'Missing version' }
          Copy-Item README.md, RELEASE_NOTES.md, STATUS.md package/SwirPhotoClean/
          $archive = "SwirPhotoClean-$version-Windows.zip"
          $checksum = "$archive.sha256"
          $provenance = "$archive.provenance.json"
          Compress-Archive -Path package/SwirPhotoClean -DestinationPath $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$digest  $archive" | Set-Content $checksum -Encoding utf8

          $channel = (python tools/release_gate.py --channel).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Release gate failed' }
          python tools/release_provenance.py write --archive $archive --output $provenance --version $version --commit $env:GITHUB_SHA --workflow-run-id $env:GITHUB_RUN_ID --channel $channel
          if ($LASTEXITCODE -ne 0) { throw 'Release provenance creation failed' }
          python tools/release_provenance.py verify --archive $archive --manifest $provenance --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel $channel
          if ($LASTEXITCODE -ne 0) { throw 'Release provenance verification failed' }

          $prepublishRoot = Join-Path $PWD 'release-archive-smoke'
          if (Test-Path $prepublishRoot) { Remove-Item $prepublishRoot -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $prepublishRoot
          $prepublishExe = Join-Path $prepublishRoot 'SwirPhotoClean/SwirPhotoClean.exe'
          if (-not (Test-Path $prepublishExe)) { throw 'Release archive is missing SwirPhotoClean.exe' }
          $prepublishReport = Join-Path $PWD 'release-archive-smoke.json'
          $process = Start-Process -FilePath $prepublishExe -ArgumentList '--self-test', $prepublishReport -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw 'Release archive self-test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Release archive self-test failed' }
          $report = Get-Content $prepublishReport -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Release archive self-test report failed' }

          if ($channel -eq 'stable') {
            gh release create "v$version" $archive $checksum $provenance --target $env:GITHUB_SHA --title "SWIR PhotoClean $version — Polski / English" --notes-file RELEASE_NOTES.md
          } elseif ($channel -eq 'prerelease') {
            gh release create "v$version" $archive $checksum $provenance --target $env:GITHUB_SHA --title "SWIR PhotoClean $version — Polski / English" --notes-file RELEASE_NOTES.md --prerelease
          } else {
            throw "Unknown release channel: $channel"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

          $publishedRoot = Join-Path $PWD 'published-release-smoke'
          New-Item -ItemType Directory -Path $publishedRoot -Force | Out-Null
          gh release download "v$version" --dir $publishedRoot --pattern $archive --pattern $checksum --pattern $provenance
          if ($LASTEXITCODE -ne 0) { throw 'Could not download published release assets' }

          $publishedArchive = Join-Path $publishedRoot $archive
          $publishedChecksum = Join-Path $publishedRoot $checksum
          $publishedProvenance = Join-Path $publishedRoot $provenance
          $checksumParts = ((Get-Content $publishedChecksum -Raw).Trim() -split '\s+')
          if ($checksumParts.Count -lt 1) { throw 'Published checksum sidecar is malformed' }
          $expectedDigest = $checksumParts[0].ToLower()
          $actualDigest = (Get-FileHash $publishedArchive -Algorithm SHA256).Hash.ToLower()
          if ($expectedDigest -ne $actualDigest) { throw 'Published ZIP checksum does not match sidecar' }

          python tools/release_provenance.py verify --archive $publishedArchive --manifest $publishedProvenance --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel $channel
          if ($LASTEXITCODE -ne 0) { throw 'Published release provenance verification failed' }

          $publishedExtracted = Join-Path $PWD 'published-release-extracted'
          if (Test-Path $publishedExtracted) { Remove-Item $publishedExtracted -Recurse -Force }
          Expand-Archive -Path $publishedArchive -DestinationPath $publishedExtracted
          $publishedExe = Join-Path $publishedExtracted 'SwirPhotoClean/SwirPhotoClean.exe'
          if (-not (Test-Path $publishedExe)) { throw 'Published release archive is missing SwirPhotoClean.exe' }
          $publishedReport = Join-Path $PWD 'published-release-smoke.json'
          $process = Start-Process -FilePath $publishedExe -ArgumentList '--self-test', $publishedReport -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw 'Published release self-test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Published release self-test failed' }
          $report = Get-Content $publishedReport -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Published release self-test report failed' }
