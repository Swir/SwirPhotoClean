name: Windows tests and portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify README progress contract
        run: python tools/readme_progress.py --check
      - name: Verify exact-version build candidate
        run: python tools/release_gate.py --build-check
      - run: python -m pip install -r requirements-build.txt
      - name: Compile Python modules
        run: python -m compileall -q photoclean tools
      - name: Core and GUI tests
        run: python -m unittest discover -s tests -v
      - name: Generate exact-head runtime safety contract
        run: |
          python tools/safety_contract.py write
          python tools/safety_contract.py verify
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name SwirPhotoClean --icon assets/SwirPhotoClean.ico --add-data "assets;assets" run.py
      - name: Smoke-test the packaged executable
        shell: pwsh
        run: |
          $reportPath = Join-Path $PWD 'packaged-smoke.json'
          $process = Start-Process -FilePath dist/SwirPhotoClean/SwirPhotoClean.exe -ArgumentList '--self-test', $reportPath -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw 'Packaged app timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged app failed' }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged smoke test failed' }
          if (-not $report.safety_contract_sha256 -or $report.safety_contract_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Packaged safety contract was not verified' }
          $sourceContract = (Get-Content assets/safety-contract.json -Raw | ConvertFrom-Json).sha256
          if ($report.safety_contract_sha256 -ne $sourceContract) { throw 'Packaged safety contract differs from exact-head source contract' }
      - name: Smoke-test packaged Portable Mode
        shell: pwsh
        run: |
          $reportPath = Join-Path $PWD 'packaged-portable-smoke.json'
          $process = Start-Process -FilePath dist/SwirPhotoClean/SwirPhotoClean.exe -ArgumentList '--portable', '--self-test', $reportPath -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw 'Packaged Portable Mode timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged Portable Mode failed' }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged Portable Mode smoke test failed' }
          if (-not $report.portable_mode_exercised) { throw 'Portable Mode was not exercised' }
          if (-not $report.portable_settings_local) { throw 'Portable settings path is not local to the package data directory' }
          if (-not $report.portable_data_dir_writable) { throw 'Portable data directory was not writable in the packaged smoke test' }
          $sourceContract = (Get-Content assets/safety-contract.json -Raw | ConvertFrom-Json).sha256
          if ($report.safety_contract_sha256 -ne $sourceContract) { throw 'Portable package safety contract differs from exact-head source contract' }
      - name: Smoke-test packaged Recycle restore command dispatch
        shell: pwsh
        run: |
          foreach ($command in @('--recycle-restore-verify', '--recycle-restore-move', '--recycle-restore-status', '--recycle-restore-review', '--recycle-restore-attest')) {
            $process = Start-Process -FilePath dist/SwirPhotoClean/SwirPhotoClean.exe -ArgumentList $command -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id; throw "Packaged Recycle command timed out: $command" }
            if ($process.ExitCode -ne 2) { throw "Expected safe argument-validation exit code 2 for $command, got $($process.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SwirPhotoClean-windows-portable
          path: dist/SwirPhotoClean/
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release gate
        run: |
          python tools/readme_progress.py --check
          python tools/release_gate.py --check
      - uses: actions/download-artifact@v4
        with:
          name: SwirPhotoClean-windows-portable
          path: package/SwirPhotoClean
      - name: Stage, verify, publish and re-verify tested portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path photoclean/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw 'Missing version' }

          $releaseEvidence = Join-Path $PWD 'RELEASE_EVIDENCE.json'
          $hasReleaseEvidence = Test-Path $releaseEvidence
          if ($hasReleaseEvidence) {
            python tools/release_evidence.py verify --file $releaseEvidence
            if ($LASTEXITCODE -ne 0) { throw 'Release runtime evidence validation failed' }
          }

          Copy-Item README.md, RELEASE_NOTES.md, STATUS.md package/SwirPhotoClean/
          if ($hasReleaseEvidence) {
            Copy-Item $releaseEvidence package/SwirPhotoClean/
          }

          $archive = "SwirPhotoClean-$version-Windows.zip"
          $checksum = "$archive.sha256"
          $provenance = "$archive.provenance.json"
          Compress-Archive -Path package/SwirPhotoClean -DestinationPath $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$digest  $archive" | Set-Content $checksum -Encoding utf8

          $channel = (python tools/release_gate.py --channel).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Release gate failed' }
          python tools/release_provenance.py write --archive $archive --output $provenance --version $version --commit $env:GITHUB_SHA --workflow-run-id $env:GITHUB_RUN_ID --channel $channel
          if ($LASTEXITCODE -ne 0) { throw 'Release provenance creation failed' }
          python tools/release_provenance.py verify --archive $archive --manifest $provenance --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel $channel
          if ($LASTEXITCODE -ne 0) { throw 'Release provenance verification failed' }

          $prepublishRoot = Join-Path $PWD 'release-archive-smoke'
          if (Test-Path $prepublishRoot) { Remove-Item $prepublishRoot -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $prepublishRoot
          $prepublishExe = Join-Path $prepublishRoot 'SwirPhotoClean/SwirPhotoClean.exe'
          if (-not (Test-Path $prepublishExe)) { throw 'Release archive is missing SwirPhotoClean.exe' }
          if ($hasReleaseEvidence) {
            $embeddedEvidence = Join-Path $prepublishRoot 'SwirPhotoClean/RELEASE_EVIDENCE.json'
            if (-not (Test-Path $embeddedEvidence)) { throw 'Qualified release archive is missing RELEASE_EVIDENCE.json' }
            python tools/release_evidence.py verify --file $embeddedEvidence
            if ($LASTEXITCODE -ne 0) { throw 'Embedded release runtime evidence is invalid' }
          }
          $prepublishReport = Join-Path $PWD 'release-archive-smoke.json'
          $process = Start-Process -FilePath $prepublishExe -ArgumentList '--self-test', $prepublishReport -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw 'Release archive self-test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Release archive self-test failed' }
          $report = Get-Content $prepublishReport -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Release archive self-test report failed' }
          if ($hasReleaseEvidence -and $report.safety_contract_sha256 -ne (Get-Content $releaseEvidence -Raw | ConvertFrom-Json).safety_contract_sha256) { throw 'Release package safety contract differs from physical runtime evidence' }

          $releaseAssets = @($archive, $checksum, $provenance)
          if ($hasReleaseEvidence) {
            $releaseAssets += $releaseEvidence
          }

          function Test-ReleaseAssets {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [Parameter(Mandatory = $true)][string]$Label
            )

            if (Test-Path $Root) { Remove-Item $Root -Recurse -Force }
            New-Item -ItemType Directory -Path $Root -Force | Out-Null
            gh release download "v$version" --dir $Root --pattern $archive --pattern $checksum --pattern $provenance
            if ($LASTEXITCODE -ne 0) { throw "Could not download $Label release assets" }

            $downloadedEvidence = $null
            if ($hasReleaseEvidence) {
              gh release download "v$version" --dir $Root --pattern 'RELEASE_EVIDENCE.json'
              if ($LASTEXITCODE -ne 0) { throw "Could not download $Label runtime evidence" }
              $downloadedEvidence = Join-Path $Root 'RELEASE_EVIDENCE.json'
              $expectedEvidenceDigest = (Get-FileHash $releaseEvidence -Algorithm SHA256).Hash.ToLower()
              $actualEvidenceDigest = (Get-FileHash $downloadedEvidence -Algorithm SHA256).Hash.ToLower()
              if ($expectedEvidenceDigest -ne $actualEvidenceDigest) { throw "$Label runtime evidence differs from tested source evidence" }
              python tools/release_evidence.py verify --file $downloadedEvidence
              if ($LASTEXITCODE -ne 0) { throw "$Label release runtime evidence is invalid" }
            }

            $downloadedArchive = Join-Path $Root $archive
            $downloadedChecksum = Join-Path $Root $checksum
            $downloadedProvenance = Join-Path $Root $provenance
            $checksumParts = ((Get-Content $downloadedChecksum -Raw).Trim() -split '\s+')
            if ($checksumParts.Count -lt 1) { throw "$Label checksum sidecar is malformed" }
            $expectedDigest = $checksumParts[0].ToLower()
            $actualDigest = (Get-FileHash $downloadedArchive -Algorithm SHA256).Hash.ToLower()
            if ($expectedDigest -ne $actualDigest) { throw "$Label ZIP checksum does not match sidecar" }

            python tools/release_provenance.py verify --archive $downloadedArchive --manifest $downloadedProvenance --expected-version $version --expected-commit $env:GITHUB_SHA --expected-workflow-run-id $env:GITHUB_RUN_ID --expected-channel $channel
            if ($LASTEXITCODE -ne 0) { throw "$Label release provenance verification failed" }

            $extracted = Join-Path $PWD "$Label-release-extracted"
            if (Test-Path $extracted) { Remove-Item $extracted -Recurse -Force }
            Expand-Archive -Path $downloadedArchive -DestinationPath $extracted
            $downloadedExe = Join-Path $extracted 'SwirPhotoClean/SwirPhotoClean.exe'
            if (-not (Test-Path $downloadedExe)) { throw "$Label release archive is missing SwirPhotoClean.exe" }
            if ($hasReleaseEvidence) {
              $embeddedEvidence = Join-Path $extracted 'SwirPhotoClean/RELEASE_EVIDENCE.json'
              if (-not (Test-Path $embeddedEvidence)) { throw "$Label qualified release archive is missing RELEASE_EVIDENCE.json" }
              python tools/release_evidence.py verify --file $embeddedEvidence
              if ($LASTEXITCODE -ne 0) { throw "$Label embedded runtime evidence is invalid" }
            }

            $selfTestReport = Join-Path $PWD "$Label-release-smoke.json"
            $process = Start-Process -FilePath $downloadedExe -ArgumentList '--self-test', $selfTestReport -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw "$Label release self-test timed out" }
            if ($process.ExitCode -ne 0) { throw "$Label release self-test failed" }
            $report = Get-Content $selfTestReport -Raw | ConvertFrom-Json
            if (-not $report.ok) { throw "$Label release self-test report failed" }
            if ($hasReleaseEvidence) {
              $evidenceContract = (Get-Content $downloadedEvidence -Raw | ConvertFrom-Json).safety_contract_sha256
              if ($report.safety_contract_sha256 -ne $evidenceContract) { throw "$Label package safety contract differs from physical runtime evidence" }
            }
          }

          if ($channel -eq 'stable') {
            gh release create "v$version" @releaseAssets --target $env:GITHUB_SHA --title "SWIR PhotoClean $version — Polski / English" --notes-file RELEASE_NOTES.md --draft
          } elseif ($channel -eq 'prerelease') {
            gh release create "v$version" @releaseAssets --target $env:GITHUB_SHA --title "SWIR PhotoClean $version — Polski / English" --notes-file RELEASE_NOTES.md --draft --prerelease
          } else {
            throw "Unknown release channel: $channel"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release staging failed' }

          $draftState = (gh release view "v$version" --json isDraft --jq '.isDraft').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect staged draft release' }
          if ($draftState -ne 'true') { throw 'Staged release unexpectedly became public before verification' }

          $stagedRoot = Join-Path $PWD 'staged-release-smoke'
          Test-ReleaseAssets -Root $stagedRoot -Label 'draft'

          try {
            gh release edit "v$version" --draft=false
            if ($LASTEXITCODE -ne 0) { throw 'Verified draft could not be published' }

            $publishedDraftState = (gh release view "v$version" --json isDraft --jq '.isDraft').Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify published release state' }
            if ($publishedDraftState -ne 'false') { throw 'Published release is still a draft' }

            $publishedPrereleaseState = (gh release view "v$version" --json isPrerelease --jq '.isPrerelease').Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify published release channel' }
            $expectedPrereleaseState = if ($channel -eq 'prerelease') { 'true' } else { 'false' }
            if ($publishedPrereleaseState -ne $expectedPrereleaseState) { throw 'Published release channel does not match release gate' }

            $publishedRoot = Join-Path $PWD 'published-release-smoke'
            Test-ReleaseAssets -Root $publishedRoot -Label 'published'
          } catch {
            $publicationFailure = $_
            gh release edit "v$version" --draft
            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'Post-publication verification failed and automatic rollback to draft also failed.'
            }
            throw $publicationFailure
          }
