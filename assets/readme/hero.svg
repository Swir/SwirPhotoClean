<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">SWIR PhotoClean — duplicate and similar photo finder</title><desc id="desc">Dark electric-cyan banner with overlapping photo cards for a local Windows photo deduplication utility.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02050A"/><stop offset=".55" stop-color="#06101A"/><stop offset="1" stop-color="#02050A"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0088FF"/><stop offset=".5" stop-color="#62E5FF"/><stop offset="1" stop-color="#0088FF"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity=".055"/></pattern><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="320" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity=".25"/><rect width="1200" height="320" rx="26" fill="url(#grid)"/><path d="M0 258C180 218 300 300 470 263S760 218 930 258S1080 286 1200 240" fill="none" stroke="url(#cyan)" stroke-opacity=".25" stroke-width="2"/><g transform="translate(64 67)"><rect x="20" y="22" width="132" height="118" rx="18" fill="#07111C" stroke="#0088FF" stroke-width="3" transform="rotate(-8 86 81)"/><rect x="42" y="40" width="132" height="118" rx="18" fill="#07111C" stroke="#62E5FF" stroke-width="3"/><circle cx="82" cy="75" r="12" fill="#62E5FF"/><path d="M56 138l32-37 25 24 22-27 29 40z" fill="#0088FF" opacity=".78"/><circle cx="160" cy="144" r="27" fill="#02050A" stroke="#62E5FF" stroke-width="4" filter="url(#glow)"/><path d="M150 144h20M160 134v20" stroke="#62E5FF" stroke-width="4" stroke-linecap="round"/></g><text x="280" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR PROJECT</text><text x="280" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="57" font-weight="800" fill="#F4FAFF">SWIR PHOTOCLEAN</text><text x="282" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#B8D2E0">Find duplicate and visually similar photos locally.</text><text x="282" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" letter-spacing="1.5" fill="#62E5FF">WINDOWS  •  LOCAL ANALYSIS  •  SAFE REVIEW</text></svg>
